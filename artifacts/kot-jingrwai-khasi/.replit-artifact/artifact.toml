kind = "web"
previewPath = "/"
title = "KOT JINGRWAI KHASI"
description = "The official cinematic website for KOT JINGRWAI KHASI, an offline Khasi Christian library by James Shylla, with app download, feature storytelling, installation guidance, and project support."
version = "1.0.0"
id = "artifacts/kot-jingrwai-khasi"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24607

[services.development]
run = "pnpm --filter @workspace/kot-jingrwai-khasi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kot-jingrwai-khasi", "run", "build" ]
serve = "static"
publicDir = "artifacts/kot-jingrwai-khasi/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24607"
BASE_PATH = "/"
